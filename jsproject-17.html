<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #app {
            width: 300px;
            margin: 30px auto;
        }

        #app-title {
            text-align: center;
        }

        #balance-box,
        #entry-box,
        #button-box {
            border: 1px solid black;
            padding: 15px;
            margin-top: 10px;
        }

        #balance-label,
        #amount-label {
            display: block;
            margin-bottom: 5px;
        }

        #amount {
            width: 95%;
            padding: 8px;
        }

        .action {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #note {
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div id="app">

        <h1 id="app-title">My Bank</h1>

        <div id="balance-box">
            <span id="balance-label">Available balance</span>
            <span id="balance">1000</span>
        </div>

        <div id="entry-box">
            <label id="amount-label" for="amount">
                Enter amount
            </label>

            <input type="number" id="amount">
        </div>

        <div id="button-box">

            <button class="action credit" id="credit-btn">
                Credit
            </button>

            <button class="action debit" id="debit-btn">
                Debit
            </button>

        </div>

        <p id="note">
            Enter an amount and choose an action.
        </p>

    </div>

</body>

</html>
